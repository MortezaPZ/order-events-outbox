name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint
        run: ruff check orderflow tests

      - name: Test
        run: pytest tests -q --cov=orderflow --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t orderflow:${{ github.sha }} .

      # A container that builds but does not serve is not a passing build.
      - name: Smoke test the container
        run: |
          docker run -d --name orderflow -p 8000:8000 orderflow:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is up after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "API did not become healthy in 30s"
              docker logs orderflow
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://localhost:8000/health | tee health.json
          grep -q '"status":"ok"' health.json

          ORDER=$(curl -fsS -X POST http://localhost:8000/orders \
            -H 'Content-Type: application/json' \
            -d '{"customer":"CI","amount":42.5}')
          echo "$ORDER"

          ORDER_ID=$(echo "$ORDER" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          # The relay and worker run in the background; give them a moment,
          # then assert the order actually advanced.
          for i in $(seq 1 15); do
            STATUS=$(curl -fsS "http://localhost:8000/orders/$ORDER_ID" \
              | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$STATUS" = "reserved" ] && break
            sleep 1
          done

          echo "final status: $STATUS"
          [ "$STATUS" = "reserved" ] || { docker logs orderflow; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs orderflow || true

      - name: Clean up
        if: always()
        run: docker rm -f orderflow || true
